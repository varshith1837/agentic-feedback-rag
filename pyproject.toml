[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "olist-revenue-risk-graph"
version = "1.0.0"
description = "Cited customer-feedback-to-revenue graph with a bounded Q&A agent"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "duckdb>=1.1,<2", "streamlit>=1.38,<2", "networkx>=3.2,<4", "pandas>=2.1,<3", "matplotlib>=3.8,<4"]
[project.optional-dependencies]
nli = ["transformers>=4.45,<6", "torch>=2.2"]
semantic = ["sentence-transformers>=3.0,<6", "numpy>=1.24"]
dev = ["pytest>=8,<10", "pytest-cov>=5"]
[project.scripts]
revenue-risk = "revenue_risk.cli:main"
[tool.setuptools]
packages = ["revenue_risk"]
[tool.pytest.ini_options]
testpaths = ["tests"]
