services:
  feedback-app:
    build: .
    ports: ["8501:8501"]
    env_file:
      - path: .env
        required: false
    environment:
      RISK_DB: /app/runtime/revenue.sqlite
    volumes:
      - ./runtime:/app/runtime
      - ./results:/app/results
    restart: unless-stopped
# For local Ollama on Linux, add 'extra_hosts: ["host.docker.internal:host-gateway"]'
# and OLLAMA_URL=http://host.docker.internal:11434 in .env.
